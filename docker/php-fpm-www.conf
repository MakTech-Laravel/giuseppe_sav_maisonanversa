; Overrides the default [www] pool from the official php-fpm image.
; Loaded after www.conf / zz-docker.conf so these values win.
[www]
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

; Coolify/runtime injects env into the container; FPM must pass it to workers.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
