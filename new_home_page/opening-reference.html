<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maison Anversa: homepage opening (reference)</title>
<!-- Reference implementation of the homepage opening "The door opens".
     Plain HTML/CSS/JS, no libraries. Port into the site's own components;
     keep the timings, layer order and rules from the briefing. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{--choc:#291C18;--ivory:#F3EBE3;--taupe:#8D705A;--gold:#B2915C;--muted:#6E5644;--line:#D8C9B6}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--choc);font-family:Montserrat,system-ui,sans-serif}
.hero{max-width:1100px;margin:0 auto;padding:56px 24px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px}
.mh-house{width:min(380px,72vw);aspect-ratio:662/796;height:auto;display:block;overflow:visible}
.ma-wordmark{width:min(420px,78vw);height:auto;display:block}
.ma-wordmark path{fill:var(--choc)}
h1{margin:0}
.greeting{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500}
.edition{margin:0;font-family:Baskervville,Georgia,serif;font-style:italic;font-size:clamp(20px,2.4vw,26px)}
.limit{margin:-12px 0 0;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.replay{background:none;border:0;padding:12px;min-height:44px;font:500 11px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* ---------- opening animation ---------- */
.mh-ln{fill:none;stroke:var(--choc);stroke-width:.9;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:ma-draw .95s cubic-bezier(.55,.1,.35,1) forwards}
.mh-b1{animation-delay:.15s}.mh-b2{animation-delay:.3s}.mh-b3{animation-delay:.45s}.mh-b4{animation-delay:.6s}.mh-b5{animation-delay:.75s}.mh-b6{animation-delay:.9s}.mh-b7{animation-delay:1.05s}
.mh-fill{fill:var(--choc);opacity:0;animation:ma-fade .8s ease-out 1.5s forwards}
.mh-glow{opacity:0;animation:ma-fade 1s ease-out 2.25s forwards}
.mh-spill{animation-delay:2.6s}
.mh-door{transform-box:fill-box;animation:ma-open 1.15s cubic-bezier(.55,0,.2,1) 2.25s forwards}
.mh-door-l{transform-origin:left center}.mh-door-r{transform-origin:right center}
.ma-in{opacity:0;transform:translateY(10px);animation:ma-rise .9s ease-out forwards}
.ma-t0{animation-delay:.2s}.ma-t1{animation-delay:3s}.ma-t2{animation-delay:3.35s}.ma-t3{animation-delay:3.7s}
@keyframes ma-draw{to{stroke-dashoffset:0}}
@keyframes ma-fade{to{opacity:1}}
@keyframes ma-open{from{transform:scaleX(1)}to{transform:scaleX(.12)}}
@keyframes ma-rise{to{opacity:1;transform:none}}
/* end state: skip, second visit in the session, reduced motion */
.is-done .mh-ln,.is-done .mh-fill,.is-done .mh-glow,.is-done .ma-in{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
.is-done .mh-door{animation:none;transform:scaleX(.12)}
@media (prefers-reduced-motion:reduce){.mh-ln,.mh-fill,.mh-glow,.ma-in{animation:none;opacity:1;transform:none;stroke-dashoffset:0}.mh-door{animation:none;transform:scaleX(.12)}}

/* ---------- register ---------- */
.register{max-width:1100px;margin:0 auto;padding:8px 24px 48px}
.reg-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;border-top:1px solid var(--line);padding-top:24px;margin-bottom:20px}
.reg-head h2{margin:0;font-family:Baskervville,Georgia,serif;font-weight:400;font-size:clamp(26px,3vw,34px)}
.legend{display:flex;gap:20px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;display:inline-block}.sw-a{border:1px solid #B9A48C;background:#FBF7F2}.sw-r{background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.num{min-height:44px;border:1px solid var(--line);background:#FBF7F2;color:var(--choc);font:500 13px Montserrat,sans-serif;letter-spacing:.04em;cursor:pointer;padding:0}
.num:hover{border-color:var(--gold)}
.num[aria-pressed="true"]{background:var(--choc);border-color:var(--choc);color:var(--ivory)}
.num:disabled{background:var(--gold);border-color:var(--gold);color:var(--choc);cursor:default}
.num:focus-visible,.cta:focus-visible,.replay:focus-visible{outline:2px solid var(--choc);outline-offset:2px}
.picked{margin:0;width:100%;text-align:center;font-family:Baskervville,Georgia,serif;font-size:22px}
.ctas{margin-top:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 32px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.cta-1{background:var(--choc);color:var(--ivory)}.cta-2{border:1px solid var(--choc);color:var(--choc)}
.rooms{background:var(--choc);color:var(--ivory);padding:56px 24px;text-align:center}
</style>
</head>

<script>
(function () {
  var hero = document.getElementById('hero');
  var KEY = 'ma-door-opened';
  function done() { hero.classList.add('is-done'); document.getElementById('register').classList.add('is-done'); }

  // 1. Play once per browser session; later page views show the end state.
  try { if (sessionStorage.getItem(KEY)) done(); sessionStorage.setItem(KEY, '1'); } catch (e) {}

  // 2. Skip: tap/click on the hero, any key, or scrolling.
  hero.addEventListener('click', function (e) { if (e.target.id !== 'replay') done(); });
  window.addEventListener('keydown', done, { once: true });
  window.addEventListener('scroll', done, { once: true, passive: true });

  // 3. Replay: restart all CSS animations.
  document.getElementById('replay').addEventListener('click', function () {
    [hero, document.getElementById('register')].forEach(function (el) {
      el.classList.remove('is-done');
      el.querySelectorAll('*').forEach(function (n) { n.style.animation = 'none'; });
      void el.offsetWidth;
      el.querySelectorAll('*').forEach(function (n) { n.style.animation = ''; });
    });
  });

  // 4. Greeting from the visitor's local time (translate per locale).
  var h = new Date().getHours();
  document.getElementById('greeting').textContent =
    (h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ' from Antwerp';

  // 5. Register. Replace REGISTER with live data from the backend (see briefing).
  var REGISTER = { reserved: [1, 2] };
  var grid = document.getElementById('grid'), claim = document.getElementById('claim'), picked = document.getElementById('picked');
  var pad = function (n) { return ('00' + n).slice(-3); };
  var sel = null;
  document.getElementById('avail').textContent = 100 - REGISTER.reserved.length;
  for (var i = 1; i <= 100; i++) (function (i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'num'; b.textContent = pad(i);
    var r = REGISTER.reserved.indexOf(i) >= 0;
    b.disabled = r; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', 'Nº ' + pad(i) + (r ? ', reserved' : ', available'));
    b.addEventListener('click', function () {
      var prev = grid.querySelector('[aria-pressed="true"]');
      if (prev) prev.setAttribute('aria-pressed', 'false');
      sel = sel === i ? null : i;
      if (sel) b.setAttribute('aria-pressed', 'true');
      picked.hidden = !sel;
      picked.textContent = sel ? 'Nº ' + pad(sel) + ': yours, if you claim it.' : '';
      claim.textContent = sel ? 'Claim Nº ' + pad(sel) : 'Choose your number';
      claim.href = sel ? '/register?number=' + pad(sel) : '#register';   // TODO: existing reservation / checkout route
    });
    grid.appendChild(b);
  })(i);
})();
</script>
